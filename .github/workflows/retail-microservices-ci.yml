name: Retail Microservices CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker --version

      - name: Prepare CI Docker Compose
        shell: bash
        run: |
          sed 's/external: true/external: false/' docker-compose.yml > docker-compose.ci.yml
          sed -i '/^[[:space:]]*name: 586fd1702d68b0d8c952a5d9c02303520fcc5693dd85f6699adc907a98362e7e$/d' docker-compose.ci.yml
          sed -i 's/"5432:5432"/"5433:5432"/' docker-compose.ci.yml

          echo "=== CI COMPOSE ==="
          cat docker-compose.ci.yml

          docker compose -f docker-compose.ci.yml config

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.ci.yml up -d postgres

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          for i in {1..60}; do
            USER_DB_READY=false
            RETAILER_DB_READY=false
            HOST_PORT_READY=false

            if docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U admin -d user_db >/dev/null 2>&1; then
              USER_DB_READY=true
            fi

            if docker compose -f docker-compose.ci.yml exec -T postgres pg_isready -U admin -d retailer_db >/dev/null 2>&1; then
              RETAILER_DB_READY=true
            fi

            if (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1; then
              HOST_PORT_READY=true
            fi

            if [ "$USER_DB_READY" = true ] && [ "$RETAILER_DB_READY" = true ] && [ "$HOST_PORT_READY" = true ]; then
              echo "PostgreSQL databases and host port 5433 are ready."
              break
            fi

            if [ "$i" -eq 60 ]; then
              echo "PostgreSQL or host port 5433 did not become ready."
              docker compose -f docker-compose.ci.yml ps postgres
              docker compose -f docker-compose.ci.yml logs --no-color postgres
              exit 1
            fi

            sleep 2
          done

          echo "=== POSTGRES STATUS ==="
          docker compose -f docker-compose.ci.yml ps postgres

      - name: Build and test User Service
        working-directory: user-service/user-service
        env:
          DB_USERNAME: admin
          DB_PASSWORD: admin123
          JWT_SECRET: ci-test-secret-key-2026-retail-microservices-abcdefghijklmnopqrstuvwxyz
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5433/user_db
        run: mvn -B clean package

      - name: Build and test Retailer Service
        working-directory: retailer-service/retailer-service
        env:
          DB_USERNAME: admin
          DB_PASSWORD: admin123
          JWT_SECRET: ci-test-secret-key-2026-retail-microservices-abcdefghijklmnopqrstuvwxyz
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5433/retailer_db
        run: mvn -B clean package

      - name: Build Docker images
        run: docker compose -f docker-compose.ci.yml build

      - name: Start services
        env:
          DB_USERNAME: admin
          DB_PASSWORD: admin123
          JWT_SECRET: ci-test-secret-key-2026-retail-microservices-abcdefghijklmnopqrstuvwxyz
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for services
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8081/swagger-ui/index.html >/dev/null 2>&1 || \
               curl -fsS http://localhost:8081/swagger-ui.html >/dev/null 2>&1; then
              echo "User Service is ready."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "User Service did not become ready."
              docker compose -f docker-compose.ci.yml logs --no-color user-service
              exit 1
            fi

            sleep 2
          done

          for i in {1..30}; do
            if curl -fsS http://localhost:8082/swagger-ui/index.html >/dev/null 2>&1 || \
               curl -fsS http://localhost:8082/swagger-ui.html >/dev/null 2>&1; then
              echo "Retailer Service is ready."
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "Retailer Service did not become ready."
              docker compose -f docker-compose.ci.yml logs --no-color retailer-service
              exit 1
            fi

            sleep 2
          done

          echo "=== DOCKER STATUS ==="
          docker compose -f docker-compose.ci.yml ps

      - name: Seed Postman test users
        shell: bash
        run: |
          set -e

          echo "=== Register CI USER ==="
          curl -fsS -X POST http://localhost:8081/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"hk","password":"hk123","role":"USER"}'

          echo
          echo "=== Register CI RETAILER ==="
          curl -fsS -X POST http://localhost:8081/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"hr","password":"hr123","role":"RETAILER"}'

          echo
          echo "CI test users registered successfully."

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman API tests
        run: |
          mkdir -p reports

          newman run \
            "postman/collections/Retail-Microservices-CI.postman_collection_v2.1.json" \
            -e "postman/environments/Retail-Microservices-Login-Test.json" \
            -r cli,htmlextra \
            --reporter-htmlextra-export "reports/newman-report.html"

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-html-report
          path: reports/newman-report.html
          if-no-files-found: warn

      - name: Show Docker logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml ps
          docker compose -f docker-compose.ci.yml logs --no-color

      - name: Docker cleanup
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down --remove-orphans || true
