services:

  postgres:
    image: postgres:16
    container_name: postgres-compose
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/01-create-retailer-db.sql:/docker-entrypoint-initdb.d/01-create-retailer-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - retail-network

  user-service:
    build:
      context: ./user-service/user-service
      dockerfile: Dockerfile
    image: user-service:1.0
    container_name: user-service-compose
    environment:
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      JWT_SECRET: my-super-secret-key-1234567890-abcdef-1234567890
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retail-network

  retailer-service:
    build:
      context: ./retailer-service/retailer-service
      dockerfile: Dockerfile
    image: retailer-service:1.0
    container_name: retailer-service-compose
    environment:
      DB_USERNAME: admin
      DB_PASSWORD: admin123
      JWT_SECRET: my-super-secret-key-1234567890-abcdef-1234567890
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retail-network

networks:
  retail-network:
    driver: bridge

volumes:
  postgres_data:
    external: true
    name: 586fd1702d68b0d8c952a5d9c02303520fcc5693dd85f6699adc907a98362e7e