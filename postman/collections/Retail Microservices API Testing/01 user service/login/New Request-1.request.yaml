      \r

      pm.test(\"JWT token exists\", function () {\r

      \    pm.expect(json.token).to.exist;\r

      });\r

      \r

      pm.test(\"JWT token is not empty\", function () {\r

      \    pm.expect(json.token).to.not.be.empty;\r

      });\r

      \r

