scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const json = pm.response.json();\r

      \r

      pm.test(\"Response exists\", function () {\r

      \    pm.expect(json).to.exist;\r

      });\r

      \r

      pm.test(\"Order ID exists\", function () {\r

      \    pm.expect(json.id).to.exist;\r

      });\r

      \r

      pm.test(\"Order ID is 3\", function () {\r

      \    pm.expect(String(json.id)).to.eql(\"3\");\r

      });\r

      \r

      pm.test(\"Order status exists\", function () {\r

      \    pm.expect(json.status).to.exist;\r

      });\r

      \r

      pm.test(\"Order status is RECEIVED\", function () {\r

      \    pm.expect(json.status).to.eql(\"RECEIVED\");\r

      });\r

      \r

      pm.test(\"Username exists\", function () {\r

      \    pm.expect(json.username).to.exist;\r

      });\r

      \r

      pm.test(\"Order items exist\", function () {\r

      \    pm.expect(json.items).to.exist;\r

      });\r

      \r

      pm.test(\"Order items are an array\", function () {\r

      \    pm.expect(json.items).to.be.an(\"array\");\r

      });\r

      \r

      pm.test(\"Grand total exists\", function () {\r

      \    pm.expect(json.grandTotal).to.exist;\r

      });"
