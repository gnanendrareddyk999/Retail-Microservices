  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const json = pm.response.json();\r

      \r

      pm.test(\"Inventory ID exists\", function () {\r

      \    pm.expect(json.id).to.exist;\r

      });\r

      \r

      pm.test(\"Product name is returned\", function () {\r

      \    pm.expect(json.productName).to.exist;\r

      });\r

      \r

      pm.test(\"Quantity is returned\", function () {\r

      \    pm.expect(json.quantity).to.exist;\r

      });\r

      \r

      pm.test(\"Price is returned\", function () {\r

      \    pm.expect(json.price).to.exist;\r

      });\r

      \r

      pm.test(\"Retailer username is returned\", function () {\r

      \    pm.expect(json.retailerUsername).to.exist;\r

      });\r

      \r

      pm.test(\"Created date is returned\", function () {\r

      \    pm.expect(json.createdAt).to.exist;\r

      });\r

      \r

      pm.environment.set(\"inventory_id\", json.id);"
