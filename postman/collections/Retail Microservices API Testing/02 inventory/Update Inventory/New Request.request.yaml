  type: bearer
  credentials:
    token: "{{json_web_token_10es}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Response is JSON\", function () {\r

      \    pm.response.to.be.json;\r

      });\r

      \r

      const json = pm.response.json();\r

      \r

      pm.test(\"Inventory ID exists\", function () {\r

      \    pm.expect(json.id).to.exist;\r

      });\r

      \r

      pm.test(\"Inventory ID matches requested ID\", function () {\r

      \    pm.expect(String(json.id)).to.eql(\r

      \        String(pm.environment.get(\"inventory_id\"))\r

      \    );\r

      });\r

      \r

      pm.test(\"Product name is updated\", function () {\r

      \    pm.expect(json.productName).to.eql(\"Gaming Laptop\");\r

      });\r

      \r

      pm.test(\"Description is updated\", function () {\r

      \    pm.expect(json.description).to.eql(\r

      \        \"Updated HP Gaming Laptop\"\r

      \    );\r

      });\r

      \r

      pm.test(\"Quantity is updated\", function () {\r

      \    pm.expect(json.quantity).to.eql(20);\r

      });\r

      \r

      pm.test(\"Price is updated\", function () {\r

      \    pm.expect(json.price).to.eql(65000);\r

      });\r

      \r

      pm.test(\"Retailer username exists\", function () {\r

      \    pm.expect(json.retailerUsername).to.exist;\r

      });\r

      \r

      pm.test(\"Created date exists\", function () {\r

      \    pm.expect(json.createdAt).to.exist;\r

      });"
