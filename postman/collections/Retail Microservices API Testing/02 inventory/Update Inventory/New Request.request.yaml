url: http://localhost:8082/inventory/7
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \  \"productName\": \"samsung\",\r

    \  \"description\": \"Updated Gaming phone\",\r

    \  \"quantity\": 9999,\r

    \  \"price\": 65000\r

    }"
