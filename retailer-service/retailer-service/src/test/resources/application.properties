spring.application.name=retailer-service-test

server.port=0

# =====================================================
# TEST DATABASE
# =====================================================

spring.datasource.url=jdbc:postgresql://127.0.0.1:5433/retailer_db
spring.datasource.username=admin
spring.datasource.password=admin123

# =====================================================
# JPA
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'

# =====================================================
# JWT
# =====================================================

jwt.secret=TEST_ONLY_SECRET_KEY_FOR_RETAILER_SERVICE

# =====================================================
# SWAGGER
# =====================================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false